replicaCount: 2

image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: "6.7.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 9898

ingress:
  enabled: false
  className: nginx
  host: app.example.internal

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

pdb:
  maxUnavailable: 1

networkPolicy:
  enabled: false
  ingressNamespace: ingress-nginx

# Spread replicas across nodes. Labels must match the selector labels.
topologySpreadConstraints: []

# Plain (non-secret) environment variables.
env: {}

metrics:
  path: /metrics
  serviceMonitor:
    enabled: false   # requires the Prometheus Operator CRDs
